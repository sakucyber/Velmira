<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Velmira</title>
<script>
  // 尽早应用主题，避免首屏闪白（原生脚本，不产生额外请求）
  try {
    var _velmira = JSON.parse(localStorage.getItem('velmira.r1') || '{}');
    if (_velmira && _velmira.theme) document.documentElement.dataset.theme = _velmira.theme;
  } catch (e) { /* ignore */ }
</script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>
<div id="app">

  <!-- ========== 书库页 ========== -->
  <section id="library-view" class="view view-library" hidden>
    <div id="library-drop-overlay" class="library-drop-overlay" role="status" hidden>
      <div class="library-drop-message">
        <span class="library-drop-plus" aria-hidden="true">＋</span>
        <strong>松开即可导入小说</strong>
        <span>支持 TXT / EPUB / CBZ · 单文件 ≤ 64MB</span>
      </div>
    </div>
    <div class="app-shell">
      <aside class="app-rail" aria-label="主导航">
        <div class="rail-top">
          <a class="rail-brand" href="/" aria-label="Velmira 书架"><span class="wordmark">Velmira</span><span class="rail-ver">v0.4</span></a>
        </div>

        <nav class="rail-nav" aria-label="书库视图">
          <button id="nav-library" class="rail-nav-item is-active" type="button" aria-current="page">
            <span class="rail-ico" aria-hidden="true">▤</span><span>书架</span>
          </button>
          <button id="nav-continue" class="rail-nav-item" type="button">
            <span class="rail-ico" aria-hidden="true">▷</span><span>继续阅读</span>
          </button>
        </nav>

        <div class="rail-foot">
          <button id="rail-import" class="btn btn-primary rail-import" type="button">导入文件</button>
          <div class="rail-status">
            <span id="lib-count" class="rail-count">0 本</span>
            <span id="lib-live" class="lib-live" data-state="connecting" role="status" aria-live="polite" title="书库实时更新状态"><i class="live-dot" aria-hidden="true"></i><span class="live-text">连接中</span></span>
          </div>
          <span class="rail-version">Velmira v0.4</span>
        </div>
      </aside>

      <div class="app-main">
        <header class="lib-header">
          <div class="lib-heading">
            <h1 class="lib-title">书架</h1>
            <p class="lib-sub"><span id="lib-sub-count">0 本</span> · 最近更新</p>
          </div>
          <div class="lib-actions">
            <label class="lib-search">
              <span class="lib-search-ico" aria-hidden="true">⌕</span>
              <input id="lib-filter" class="lib-search-input" type="search" placeholder="搜索书名" aria-label="按书名过滤书架" autocomplete="off">
            </label>
            <button id="lib-refresh" class="btn btn-icon lib-refresh" type="button" title="刷新书架" aria-label="刷新书架"><span class="ico">↻</span></button>
          </div>
        </header>

        <div id="drop-zone" class="drop-zone drop-strip" tabindex="0" role="button" aria-label="选择或拖入 TXT / EPUB / CBZ 文件导入">
          <div class="drop-plus" aria-hidden="true">＋</div>
          <div class="drop-copy">
            <div class="drop-title">拖入 TXT / EPUB / CBZ，或点击选择文件</div>
            <div class="drop-hint">拖到书架任意位置即可导入 · 单文件 ≤ 64MB</div>
          </div>
          <span class="drop-cta">选择文件</span>
          <div id="import-status" class="import-status" hidden></div>
          <input id="file-input" type="file" accept=".txt,.epub,.cbz,text/plain,application/epub+zip,application/zip" hidden>
        </div>

        <div id="lib-error" class="lib-error" hidden role="alert">
          <span id="lib-error-text" class="lib-error-text"></span>
          <button id="lib-error-retry" class="btn btn-ghost lib-error-retry" type="button">重试</button>
        </div>

        <div class="shelf-head">
          <h2 class="shelf-title" id="shelf-title">全部书目</h2>
          <span class="shelf-count" id="shelf-count" hidden>0 本</span>
        </div>

        <ul id="book-list" class="book-list" aria-label="书架列表"></ul>

        <ul id="lib-skeleton" class="book-list book-skeleton" aria-hidden="true">
          <li class="skeleton-card"><span class="sk-cover"></span><span class="sk-line"></span><span class="sk-line sk-short"></span></li>
          <li class="skeleton-card"><span class="sk-cover"></span><span class="sk-line"></span><span class="sk-line sk-short"></span></li>
          <li class="skeleton-card"><span class="sk-cover"></span><span class="sk-line"></span><span class="sk-line sk-short"></span></li>
        </ul>

        <div id="lib-noresult" class="lib-noresult" hidden>没有匹配的书名</div>

        <div id="lib-empty" class="lib-empty" hidden>
          <div class="empty-ico" aria-hidden="true">▤</div>
          <div class="empty-title">书架还是空的</div>
          <p class="empty-text" id="lib-empty-text">拖入或选择 TXT / EPUB / CBZ 文件，导入后在这里开始阅读。</p>
          <button id="lib-empty-pick" class="btn btn-primary" type="button">选择文件</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== 阅读器 ========== -->
  <section id="reader-view" class="view view-reader" hidden>
    <header class="reader-top">
      <a id="btn-back" class="btn btn-icon reader-back" href="/" title="返回书架" aria-label="返回书架"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg></span></a>
      <div class="reader-meta">
        <div id="chapter-label" class="reader-chapter">—</div>
        <div id="book-title" class="reader-title">加载中…</div>
      </div>
      <div class="reader-tools">
        <div class="tool-group tool-main" role="group" aria-label="阅读工具">
          <button id="btn-bookmark" class="btn btn-tool btn-tool-icon" type="button" title="书签当前段 (B)" aria-pressed="false" aria-label="书签当前段"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="star-line" d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.4 6.2 20.6l1.1-6.4L2.6 9.6l6.5-.9z"/><path class="star-fill" d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.4 6.2 20.6l1.1-6.4L2.6 9.6l6.5-.9z" fill="currentColor" stroke="none"/></svg></span></button>
          <span class="tool-subsep" aria-hidden="true"></span>
          <button id="btn-bookmarks" class="btn btn-tool" type="button" title="书签列表"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5h12a1 1 0 0 1 1 1V20l-7-4.2L5 20V5.5a1 1 0 0 1 1-1z"/></svg></span><span class="lbl">书签</span></button>
          <button id="btn-notes" class="btn btn-tool" type="button" title="笔记与高亮"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h8"/><path d="M16.8 3.7a2.2 2.2 0 0 1 3.1 3.1L7.5 19.2 3 20.4l1.2-4.5z"/></svg></span><span class="lbl">笔记</span></button>
          <button id="btn-toc" class="btn btn-tool" type="button" title="目录 (T)"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3.6 6h.01M3.6 12h.01M3.6 18h.01"/></svg></span><span class="lbl">目录</span></button>
          <button id="btn-search" class="btn btn-tool" type="button" title="搜索 (F)"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></span><span class="lbl">搜索</span></button>
          <button id="btn-segments" class="btn btn-tool" type="button" title="本章候选片段"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h11M4 18h7"/></svg></span><span class="lbl">片段</span></button>
          <button id="btn-ai" class="btn btn-tool" type="button" title="AI 分析与人物卡"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v4M17 3v4M3 7h18M5 11h4M15 11h4M5 16h4M15 16h4M7 21v-4M17 21v-4"/></svg></span><span class="lbl">AI</span></button>
        </div>
        <span class="tool-sep" aria-hidden="true"></span>
        <div class="tool-group tool-minor" role="group" aria-label="显示设置">
          <button id="btn-theme" class="btn btn-icon btn-tool" type="button" title="主题"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></span></button>
          <button id="btn-font" class="btn btn-icon btn-tool" type="button" title="字号"><span class="ico ico-text">Aa</span></button>
        </div>
      </div>
    </header>

    <div id="progress-track" class="progress-track" role="progressbar" aria-label="全书进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <main id="reader-main" class="reader-main">
      <div id="reader-viewport" class="reader-viewport" tabindex="0" aria-label="正文分页区域">
        <div id="reader-column" class="reader-column"></div>
      </div>
      <button id="btn-page-prev" class="page-arrow page-prev" type="button" aria-label="上一页" title="上一页"><span aria-hidden="true">‹</span></button>
      <button id="btn-page-next" class="page-arrow page-next" type="button" aria-label="下一页" title="下一页"><span aria-hidden="true">›</span></button>
    </main>

    <footer class="reader-foot">
      <span id="page-label" class="foot-page" aria-live="polite">— / —</span>
      <span class="foot-hint">← → / 空格 翻页 · T 目录 · F 搜索</span>
      <span class="foot-end">
        <span id="finished-chip" class="finish-chip" hidden>已读完</span>
        <span id="percent-label" class="foot-percent">0.0%</span>
      </span>
    </footer>
  </section>

  <div id="drawer-layer" class="drawer-layer" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="debug-badge" class="debug-badge" hidden></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
