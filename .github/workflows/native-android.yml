name: Build native Android APKs

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_TARGET_API: '35'

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --licenses > /dev/null)
          "$sdkmanager" --install \
            "platforms;android-$ANDROID_TARGET_API" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION"
      - name: Install Rust Android targets
        run: |
          rustup update stable
          rustup target add --toolchain stable aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Build developer-signed APKs
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          ./scripts/build-native-android.ps1 -Sdk $env:ANDROID_HOME `
            -Ndk (Join-Path $env:ANDROID_HOME "ndk/$env:ANDROID_NDK_VERSION") `
            -BuildToolsVersion $env:ANDROID_BUILD_TOOLS_VERSION `
            -TargetApi $env:ANDROID_TARGET_API
      - name: Record APK checksums
        shell: bash
        run: |
          cd dist
          sha256sum Velmira-android-{arm64-v8a,armeabi-v7a,x86_64,universal}.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: velmira-native-android-preview
          path: |
            dist/Velmira-android-*.apk
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
