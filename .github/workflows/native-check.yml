name: Native Rust checks

on:
  pull_request:
    paths: ["Cargo.*", "apps/**", "crates/**", ".github/workflows/native-check.yml"]
  push:
    branches: [main]
    paths: ["Cargo.*", "apps/**", "crates/**", ".github/workflows/native-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable
      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libx11-dev libwayland-dev
      - run: cargo +stable fmt --all --check
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable build --release --locked -p velmira-native
      - uses: actions/upload-artifact@v5
        with:
          name: native-preview-${{ matrix.os }}-${{ runner.arch }}
          path: |
            target/release/velmira-native
            target/release/velmira-native.exe
          if-no-files-found: error
