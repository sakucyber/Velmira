name: Verify and build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install server and bundle dependencies
        run: python -m pip install -r server/requirements.txt pyinstaller

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        # v3 默认安装已移除的 "tools" 包；v4 默认只安装 platform-tools。
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        shell: pwsh
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0"

      - name: Check web JavaScript
        shell: pwsh
        run: |
          $bad = 0
          $tmp = Join-Path $env:TEMP "velmira-js"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Get-ChildItem web -Recurse -Filter *.js | ForEach-Object {
            $dest = Join-Path $tmp $_.Name.Replace('.js', '.mjs')
            Copy-Item $_.FullName $dest
            node --check $dest
            if ($LASTEXITCODE -ne 0) { $bad++ }
          }
          if ($bad -gt 0) { throw "node --check failed: $bad" }

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Test desktop backend selection
        working-directory: desktop
        run: go test ./...

      - name: Build desktop bundle
        shell: pwsh
        env:
          GOPROXY: https://goproxy.cn,direct
        run: ./scripts/build-desktop-bundle.ps1

      - name: Verify packaged backend, annotations, bookshelf and settings
        shell: pwsh
        run: |
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP 'velmira-data'
          $backend = Start-Process -FilePath './dist/Velmira-desktop-v0.4.0/backend/Velmira-backend/Velmira-backend.exe' -ArgumentList '--port','8876' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i=0; $i -lt 120; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8876/api/health
                if ($health.ok -and $health.version -eq '0.4.0') { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'Packaged backend did not become ready' }
            node tests/cdp_annotations.mjs --base http://127.0.0.1:8876
            if ($LASTEXITCODE -ne 0) { throw 'Annotation browser regression failed' }
            node tests/cdp_library_settings.mjs --base http://127.0.0.1:8876
            if ($LASTEXITCODE -ne 0) { throw 'Bookshelf/settings browser regression failed' }
          } finally {
            taskkill /PID $backend.Id /T /F
          }

      - name: Build Android APK
        shell: pwsh
        run: ./scripts/build-android.ps1

      - name: Upload desktop and Android artifacts
        uses: actions/upload-artifact@v5
        with:
          name: velmira-v0.4.0-windows-android
          path: |
            dist/Velmira-desktop-v0.4.0
            dist/Velmira-universal.apk
