[package]
name = "vm-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8"
ciborium = "0.2"
curve25519-dalek = "4"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
snow = { version = "0.10", default-features = false, features = ["std", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
spake2 = "0.4"
subtle = "2.6"
thiserror = "2"
vm-core = { path = "../vm-core" }
zeroize = "1"
