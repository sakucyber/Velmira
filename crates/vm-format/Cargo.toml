[package]
name = "vm-format"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[dependencies]
encoding_rs = "0.8"
html5ever = "0.35"
percent-encoding = "2"
regex = "1"
roxmltree = "0.20"
thiserror = "2"
vm-core = { path = "../vm-core" }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1"
